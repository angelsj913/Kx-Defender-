<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kx-Defender Console</title>
  <link rel="stylesheet" href="/assets/console.css" />
</head>
<body>
  <div class="grid-bg"></div>
  <div class="scanlines"></div>

  <!-- Top Header -->
  <header class="top">
    <div class="brand">KX-DEFENDER <span>eDEX HUD</span></div>
    <div class="meta">
      <label><span data-i18n="scope">SCOPE</span>
        <select id="scope">
          <option value="lab" data-i18n="scope.lab">LAB</option>
          <option value="owned" data-i18n="scope.owned">OWNED</option>
          <option value="pact" data-i18n="scope.pact">PACT</option>
        </select>
      </label>
      <label><span data-i18n="mode">MODE</span>
        <select id="mode">
          <option value="sim" data-i18n="mode.sim">SIM</option>
          <option value="live" data-i18n="mode.live">LIVE</option>
        </select>
      </label>
      <button id="lang-toggle" class="lang-toggle" title="Language">KO / EN</button>
      <span id="health" class="pill">…</span>
    </div>
  </header>

  <!-- Command Input Bar -->
  <section class="command">
    <div class="prompt">kx&gt;</div>
    <div class="cmd-wrap">
      <input id="cmd" autocomplete="off" spellcheck="false"
        data-i18n-placeholder="cmd.placeholder"
        placeholder="roast tickets --realm lab.local   |   /h   |   sentry detect" />
      <div id="suggest" class="suggest" role="listbox" aria-label="command suggestions"></div>
    </div>
    <button id="run" data-i18n="btn.run">RUN</button>
    <button id="clear-btn" class="danger" data-i18n="btn.clear">CLEAR</button>
  </section>

  <!-- Status Bar (Real-time) -->
  <section class="status-bar">
    <div class="status-item">
      <span class="status-label" data-i18n="stat.status">STATUS</span>
      <span id="stat-status" class="status-value" data-i18n="status.idle">IDLE</span>
    </div>
    <div class="status-item">
      <span class="status-label" data-i18n="stat.module">MODULE</span>
      <span id="stat-module" class="status-value">—</span>
    </div>
    <div class="status-item">
      <span class="status-label" data-i18n="stat.duration">DURATION</span>
      <span id="stat-duration" class="status-value">0ms</span>
    </div>
    <div class="status-item">
      <span class="status-label" data-i18n="stat.findings">FINDINGS</span>
      <span id="stat-findings" class="status-value">0</span>
    </div>
    <div class="status-item">
      <span class="status-label" data-i18n="stat.artifacts">ARTIFACTS</span>
      <span id="stat-artifacts" class="status-value">0</span>
    </div>
    <div class="status-item">
      <span class="status-label" data-i18n="stat.runs">RUNS</span>
      <span id="stat-runs" class="status-value">0</span>
    </div>
  </section>

  <!-- Main 2x2 Grid + Bottom Ledger -->
  <main class="grid">
    <section class="panel" id="panel-sentry">
      <div class="panel-header">
        <h2 data-i18n="panel.sentry">SENTRY / DEFENSE</h2>
        <span id="badge-sentry" class="panel-badge" data-i18n="badge.idle">idle</span>
      </div>
      <div class="actions">
        <button data-cmd="watch procs">watch procs</button>
        <button data-cmd="sentry detect">sentry detect</button>
        <button data-cmd="sig scan">sig scan</button>
        <button data-cmd="triage incident">triage</button>
      </div>
      <div class="out" id="out-sentry">ready</div>
    </section>

    <section class="panel" id="panel-strike">
      <div class="panel-header">
        <h2 data-i18n="panel.strike">STRIKE / ATTACK</h2>
        <span id="badge-strike" class="panel-badge" data-i18n="badge.idle">idle</span>
      </div>
      <div class="actions">
        <button data-cmd="roast tickets --realm lab.local">roast</button>
        <button data-cmd="relay esc8 --at adcs.lab.local">relay</button>
        <button data-cmd="breach entra --realm contoso.lab.local">breach</button>
        <button data-cmd="probe mind --at local-fixture">probe</button>
      </div>
      <div class="out" id="out-strike">ready</div>
    </section>

    <section class="panel" id="panel-sweep">
      <div class="panel-header">
        <h2 data-i18n="panel.sweep">SWEEP / WEB</h2>
        <span id="badge-sweep" class="panel-badge" data-i18n="badge.idle">idle</span>
      </div>
      <div class="actions">
        <button data-cmd="sweep web --url http://127.0.0.1/">sweep web</button>
        <button data-cmd="sweep xss --url http://127.0.0.1/">sweep xss</button>
        <button data-cmd="sweep sqli --url http://127.0.0.1/">sweep sqli</button>
        <button data-cmd="sweep jwt --url http://127.0.0.1/">sweep jwt</button>
      </div>
      <div class="out" id="out-sweep">ready</div>
    </section>

    <section class="panel" id="panel-nexus">
      <div class="panel-header">
        <h2 data-i18n="panel.nexus">NEXUS / C2</h2>
        <span id="badge-nexus" class="panel-badge" data-i18n="badge.idle">idle</span>
      </div>
      <div class="actions">
        <button data-cmd="nexus status">status</button>
        <button data-cmd="nexus listen --bind 127.0.0.1:4455">listen havoc</button>
        <button data-cmd="nexus sliver --bind 127.0.0.1:4456">listen sliver</button>
      </div>
      <div class="out" id="out-nexus">ready</div>
    </section>

    <section class="panel wide" id="panel-ledger">
      <div class="panel-header">
        <h2 data-i18n="panel.ledger">LEDGER / HISTORY</h2>
        <div class="ledger-controls">
          <span id="badge-ledger" class="panel-badge count">0</span>
          <button id="refresh" data-i18n="btn.refresh">refresh</button>
        </div>
      </div>
      <div class="out" id="out-ledger" data-i18n="msg.loading">loading…</div>
    </section>
  </main>

  <script src="/assets/console.js"></script>
</body>
</html>
